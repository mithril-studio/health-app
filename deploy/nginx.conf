# boxd terminates public TLS and wakes on incoming network traffic.
server {
    listen 8000 default_server;
    server_name coach-reachy.boxd.sh;
    server_tokens off;
    client_max_body_size 64k;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    # Next.js hydration currently uses inline scripts/styles; all external origins are denied.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    # Do not trust a user-supplied IP chain.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 240s;
    proxy_send_timeout 240s;
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_buffering off;
    }
    location /mcp {
        proxy_pass http://127.0.0.1:8001;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
    }
}
